[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kbm-follow"
dynamic = ["version"]
description = "Que tu mouse multidispositivo (y otros periféricos) siga a tu teclado de una computadora a otra."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sebastian Guadalupe Tanori Ruiz" }]
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]
keywords = ["kvm", "easy-switch", "multi-device", "bluetooth", "logitech", "hid", "hidpp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/tanoriruizs/kbm-follow"
Issues = "https://github.com/tanoriruizs/kbm-follow/issues"

[project.scripts]
kbm-follow = "kbm_follow.__main__:main"

# Los drivers de otras marcas se registran desde su propio paquete en el grupo
# de entry points "kbm_follow.drivers" (ver el README).

[tool.setuptools]
packages = ["kbm_follow", "kbm_follow.drivers"]

[tool.setuptools.dynamic]
version = { attr = "kbm_follow.__version__" }
